function startPractice(id){const pool=[...BANK[id]];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}practice={id,questions:pool,index:0,answers:[],locked:false,score:0,done:false};go('quiz')}
function quiz(){if(!practice)return `<div class="card empty">Pilih topik dahulu. <button class="btn" data-nav="topics">Pilih topik</button></div>`;
const p=practice,t=TOPICS[p.id];if(p.done)return `<div class="card quiz-page" style="text-align:center"><div style="font-size:60px">${p.score>=6?'🏆':'🌈'}</div><div class="eyebrow">Misi selesai!</div><h1>${t.title}</h1><div class="scorebig">${p.score} / ${p.questions.length}</div><p>${p.score===8?'Hebat, Safa! Semua jawapan betul!':p.score>=6?'Bagus! Teruskan usaha untuk mencapai 100%.':'Jangan putus asa! Baca nota dan cuba lagi.'}</p><p class="small">Safa memperoleh ${p.score*10} ⭐ dalam sesi ini.</p><div class="actions" style="justify-content:center"><button class="btn" data-practice="${p.id}">Ulang kuiz</button><button class="btn ghost" data-note="${p.id}">Baca nota</button><button class="btn outline" data-nav="topics">Topik lain</button></div></div>`;

function answerPractice(i){if(!practice||practice.done||practice.answers[practice.index]!==undefined)return;let p=practice,q=p.questions[p.index],good=i===q[2];p.answers[p.index]=i;p.score+=+good;data.total++;data.correct+=+good;let st=data.byTopic[p.id]||{total:0,correct:0};st.total++;st.correct+=+good;data.byTopic[p.id]=st;if(good){stars(10);burst()}save();render()}

function updateCounts(){let d=$('#draft');if(d){const c=$('#draftCount');c.textContent=`${wordCount(d.value)} patah perkataan · Draf disimpan automatik pada peranti ini`}let eC=$('#examCCount');if(eC)eC.textContent=wordCount(exam?.C||'')+' patah perkataan';let eD=$('#examDCount');if(eD)eD.textContent=wordCount(exam?.D||'')+' patah perkataan'}
function examHome(){const latest=data.history.find(h=>h.type==='Simulasi');return `${header('📝 PERCUBAAN UJIAN','Simulasi Akhir Tahun BM','Latihan ciptaan AIRA berdasarkan topik yang diberikan oleh guru.') }<div class="card hero"><div class="eyebrow">Cabaran 50 markah</div><h2 style="font-size:27px;margin:10px 0">Safa boleh buat! 🌟</h2><p>Jawab objektif, respons pendek, satu perenggan dan satu karangan dalam 75 minit. Boleh buat bersama Ummi.</p><div class="actions"><button class="btn white" data-examstart="1">${exam&&!exam.done?'Sambung simulasi':'Mulakan simulasi'}</button></div></div><h2 class="section-title">Pembahagian bahagian</h2><div class="grid two"><div class="stat"><b>Bahagian A · 10 markah</b><p class="small">10 soalan objektif: tatabahasa dan petikan.</p></div><div class="stat"><b>Bahagian B · 10 markah</b><p class="small">5 respons pendek / kreatif untuk semakan bersama Ummi.</p></div><div class="stat"><b>Bahagian C · 10 markah</b><p class="small">Perenggan: Cara Menjaga Keselamatan di Jalan Raya.</p></div><div class="stat"><b>Bahagian D · 20 markah</b><p class="small">Karangan: Ciri-ciri Murid Cemerlang.</p></div></div><div class="note" style="margin-top:16px">Mengikut rujukan format KPM Tahun 2025: BM tahap dua, 50 markah, 1 jam 15 minit. Latihan ini bukan soalan rasmi dan susunan itemnya ialah contoh untuk Safa.</div>${latest?`<p class="small">Keputusan simulasi terdahulu: <strong>${latest.score}/${latest.max}</strong> · ${latest.date}</p>`:''}`}
function createExam(){exam={start:Date.now(),remaining:75*60,lastTick:Date.now(),stage:'A',index:0,A:[],B:['','','','',''],C:'',D:'',scoresB:[null,null,null,null,null],scoreC:0,scoreD:0,submitted:false,done:false};saveExam()}
function saveExam(){if(SHARED_HOST)return;try{sessionStorage.setItem(KEY+'-exam',JSON.stringify(exam))}catch(e){}}
function resumeExam(){if(!exam||exam.done)createExam();go('examrun');startTimer()}
function timeString(secs){secs=Math.max(0,Math.floor(secs));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{if(!exam||exam.done)return;if(exam.submitted)return;const now=Date.now(),elapsed=Math.max(0,Math.floor((now-(exam.lastTick||now))/1000));exam.lastTick=now;exam.remaining=Math.max(0,exam.remaining-elapsed);const t=$('#timer');if(t){t.textContent='⏱️ '+timeString(exam.remaining);t.classList.toggle('warning',exam.remaining<=300)}if(exam.remaining===0){exam.submitted=true;exam.stage='review';saveExam();render();toast('Masa tamat! Semak jawapan dengan Ummi.')}else if(exam.remaining%10===0)saveExam()},1000)}
function examRun(){if(!exam)return examHome();if(exam.done)return examResult();if(exam.submitted)return examReview();const stage=exam.stage;return `${header('📝 SIMULASI SAFA','Ujian Akhir Tahun','Jawapan disimpan sementara dalam sesi. Semak semua bahagian sebelum menghantar.') }<div class="hstack" style="justify-content:space-between;margin-bottom:15px"><span class="timer ${exam.remaining<=300?'warning':''}" id="timer">⏱️ ${timeString(exam.remaining)}</span><button class="btn outline" data-submit="1">Hantar & semak</button></div><div class="exam-tabs">${['A','B','C','D'].map((s)=>`<button data-stage="${s}" class="${stage===s?'on':''} ${isStageComplete(s)?'done':''}">${s} · ${s==='D'?20:10}m</button>`).join('')}</div><div class="card">${stage==='A'?examA():stage==='B'?examB():stage==='C'?examEssay('C'):examEssay('D')}</div>`}
function isStageComplete(s){if(!exam)return false;if(s==='A')return exam.A.filter(x=>x!==undefined).length===10;if(s==='B')return exam.B.every(x=>x.trim());return Boolean((exam[s]||'').trim())}
function examA(){const i=exam.index,q=EXAM_A[i],v=exam.A[i];return `<div class="hstack" style="justify-content:space-between"><span class="chip">A · Soalan ${i+1} / 10</span><button class="btn outline" data-speak="examA">🔊 Baca</button></div>${q.passage?`<div class="writing-prompt"><strong>Petikan</strong><p style="font-size:14px">${PASSAGE}</p></div>`:''}<h2 class="q-title">${esc(q.q)}</h2>${q.choices.map((ch,j)=>`<button class="choice ${v===j?'correct':''}" data-examanswer="${j}"><span class="letter">${'ABCD'[j]}</span>${esc(ch)}${v===j?' ✓':''}</button>`).join('')}<div class="actions" style="justify-content:space-between;margin-top:19px"><button class="btn ghost" data-examprev="1" ${i===0?'disabled':''}>← Sebelum</button><button class="btn" data-examnext="1">${i===9?'Pergi ke B →':'Seterusnya →'}</button></div>`}
function examB(){return `<div class="eyebrow">Bahagian B · 10 markah</div><h2>Respons pendek dan kreatif</h2><p class="small">Jawab kelima-lima soalan (2 markah setiap soalan). Ummi akan membantu menyemak jawapan.</p><div class="writing-prompt"><b>Petikan rujukan</b><p>${PASSAGE}</p></div>${EXAM_B.map((q,i)=>`<div class="question-row"><label for="b${i}">${i+1}. ${esc(q.q)}</label><textarea id="b${i}" data-binput="${i}" placeholder="Tulis jawapan Safa...">${esc(exam.B[i])}</textarea></div>`).join('')}<div class="actions" style="margin-top:16px"><button class="btn ghost" data-stage="A">← Bahagian A</button><button class="btn" data-stage="C">Bahagian C →</button></div>`}
function examEssay(s){let t=TASKS[s];return `<div class="eyebrow">Bahagian ${s} · ${s==='C'?10:20} markah</div><h2>${t.title}</h2><p>${t.instruction}</p><div class="writing-prompt"><strong>Fikir dahulu:</strong><ul>${t.points.map(p=>`<li>${p}</li>`).join('')}</ul></div><textarea class="writing-area ${s==='D'?'tall':''}" data-examessay="${s}" placeholder="Tulis jawapan Safa di sini...">${esc(exam[s])}</textarea><div class="count" id="exam${s}Count">${wordCount(exam[s])} patah perkataan</div><div class="actions" style="margin-top:15px"><button class="btn ghost" data-stage="${s==='C'?'B':'C'}">← Sebelum</button>${s==='C'?'<button class="btn" data-stage="D">Bahagian D →</button>':'<button class="btn teal" data-submit="1">✅ Hantar & semak bersama Ummi</button>'}</div></div>`}
function examReview(){const markA=EXAM_A.reduce((v,q,i)=>v+(exam.A[i]===q.a?1:0),0);return `${header('🔎 SEMAK BERSAMA UMMI','Semakan jawapan','Objektif ditanda secara automatik. Ummi perlu menyemak B, C dan D.') }<div class="card"><div class="stat" style="background:#f8f5ff"><div class="eyebrow">Markah Bahagian A (automatik)</div><div class="scorebig">${markA} / 10</div></div><details class="details"><summary>Lihat jawapan Bahagian A</summary>${EXAM_A.map((q,i)=>`<div class="question-row"><b>${i+1}. ${esc(q.q)}</b><div class="small">Jawapan Safa: ${exam.A[i]===undefined?'Belum jawab':esc(q.choices[exam.A[i]])}<br>Jawapan betul: ${esc(q.choices[q.a])} ${exam.A[i]===q.a?'✅':'❌'}<br>${esc(q.why)}</div></div>`).join('')}</details><h2>Bahagian B · 10 markah</h2><p class="small">Baca jawapan Safa dan contoh jawapan. Pilih 0, 1 atau 2 markah bagi setiap soalan.</p>${EXAM_B.map((q,i)=>`<div class="review-item"><label>${i+1}. ${esc(q.q)}</label><p class="small"><strong>Jawapan Safa:</strong> ${esc(exam.B[i]||'— Belum jawab —')}</p><p class="small"><strong>Contoh:</strong> ${esc(q.sample)}</p><p class="small">Kriteria: ${esc(q.rubric)}</p><div class="score-pick">${[0,1,2].map(n=>`<button class="${exam.scoresB[i]===n?'selected':''}" data-scoreb="${i}:${n}" aria-label="${n} markah untuk soalan ${i+1}">${n}</button>`).join('')} <span class="small">markah</span></div></div>`).join('')}${['C','D'].map(s=>`<h2>Bahagian ${s} · ${s==='C'?10:20} markah</h2><div class="review-item"><p><strong>${TASKS[s].title}</strong></p><p class="small" style="white-space:pre-line"><b>Karangan Safa:</b> ${esc(exam[s]||'— Belum jawab —')}</p><details class="details"><summary>Lihat contoh jawapan</summary><p style="white-space:pre-line">${esc(TASKS[s].sample)}</p></details><p class="small">Panduan semakan: kandungan relevan, ayat gramatis, ejaan dan tanda baca, susunan isi serta penutup. Berikan markah anggaran untuk latihan sahaja.</p><div class="range-label"><label for="range${s}">Markah anggaran</label><strong id="score${s}">${exam['score'+s]} / ${s==='C'?10:20}</strong></div><input class="range" id="range${s}" type="range" min="0" max="${s==='C'?10:20}" step="1" value="${exam['score'+s]}" data-scorerange="${s}"></div>`).join('')}<div class="note">⚠️ Markah B, C dan D ialah semakan latihan oleh Ummi, bukan pemarkahan guru atau markah rasmi KPM.</div><div class="actions" style="margin-top:18px"><button class="btn teal" data-finish="1" ${exam.scoresB.some(x=>x===null)?'disabled':''}>🏆 Simpan keputusan Safa</button></div>${exam.scoresB.some(x=>x===null)?'<p class="small">Pilih markah bagi semua lima soalan Bahagian B dahulu.</p>':''}</div>`}
function examResult(){let a=EXAM_A.reduce((v,q,i)=>v+(exam.A[i]===q.a?1:0),0),b=exam.scoresB.reduce((v,n)=>v+(n||0),0),total=a+b+exam.scoreC+exam.scoreD,grade=total>=41?'A':total>=33?'B':total>=25?'C':total>=18?'D':total>=10?'E':'F';return `<div class="card" style="text-align:center;max-width:850px;margin:auto"><div style="font-size:65px">🏆</div><div class="eyebrow">Tamat simulasi!</div><h1>Tahniah, Safa! 💜</h1><div class="scorebig">${total} / 50</div><div class="result-badge">${total*2}% · Gred latihan ${grade}</div><p>Setiap latihan menjadikan Safa lebih bersedia. Teruskan usaha dan jaga akhlak yang baik!</p><div class="grid two" style="text-align:left;margin:20px 0"><div class="stat"><strong>A · Objektif</strong><div class="num">${a}/10</div></div><div class="stat"><strong>B · Respons</strong><div class="num">${b}/10</div></div><div class="stat"><strong>C · Perenggan</strong><div class="num">${exam.scoreC}/10</div></div><div class="stat"><strong>D · Karangan</strong><div class="num">${exam.scoreD}/20</div></div></div><div class="actions" style="justify-content:center"><button class="btn" data-nav="parent">📊 Laporan Ummi</button><button class="btn ghost" data-restart="1">Cuba simulasi baharu</button><button class="btn outline" data-nav="home">🏠 Rumah</button></div></div>`}
function parent(){const acc=pct(data.correct,data.total);const sessions=data.history;return `${header('📊 RUANG UMMI','Laporan pembelajaran Safa','Di laman web perkongsian, rekod hanya untuk sesi ini; tiada akaun atau penghantaran jawapan oleh aplikasi.') }<div class="grid"><div class="stat"><div class="num">${data.total}</div><div class="label">Jumlah soalan dijawab</div></div><div class="stat"><div class="num">${acc}%</div><div class="label">Jawapan latihan betul</div></div><div class="stat"><div class="num">${data.stars} ⭐</div><div class="label">Bintang terkumpul</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2 style="margin-top:0">Prestasi mengikut topik</h2>${Object.keys(TOPICS).map(id=>{let s=data.byTopic[id]||{total:0,correct:0};return `<div class="barline"><span class="topic">${EMOJI[id]} ${TOPICS[id].title}</span><div class="progress"><span style="width:${pct(s.correct,s.total)}%"></span></div><span class="percent">${s.total?pct(s.correct,s.total)+'%':'—'}</span></div>`}).join('')}<div class="note" style="margin-top:16px">Tumpukan ulang kaji kepada topik dengan ketepatan bawah 70%.</div></div><div class="card"><h2 style="margin-top:0">Sejarah latihan</h2>${sessions.length? sessions.slice(0,10).map(h=>`<div class="barline" style="border-bottom:1px solid var(--line);padding:7px 0"><span class="topic">${esc(h.type)}<br><span class="small">${esc(h.date)}</span></span><b>${h.score}/${h.max}</b></div>`).join(''):'<div class="empty">Belum ada keputusan. Safa boleh mulakan kuiz pertama hari ini! 🌷</div>'}</div></div><h2 class="section-title">🏅 Lencana pencapaian</h2><div class="badge-list"><div class="achievement ${data.total<1?'locked':''}">🌼<strong>Langkah pertama</strong>Jawab satu soalan</div><div class="achievement ${data.total<20?'locked':''}">⭐<strong>Rajin belajar</strong>Jawab 20 soalan</div><div class="achievement ${data.stars<300?'locked':''}">🌟<strong>Bintang ceria</strong>Kumpul 300 bintang</div><div class="achievement ${!sessions.some(h=>h.type==='Simulasi')?'locked':''}">🏆<strong>Berani mencuba</strong>Siapkan simulasi</div></div><div class="card" style="margin-top:17px"><h3 style="margin-top:0">🗂️ Simpan rekod</h3><p class="small">Muat turun laporan dalam format CSV untuk simpanan Ummi. Boleh juga cetak halaman ini.</p><div class="actions"><button class="btn" data-export="1">⬇️ Muat turun laporan CSV</button><button class="btn ghost" data-print="1">🖨️ Cetak</button><button class="btn outline" data-reset="1">Tetapkan semula rekod</button></div></div>`}
function finishExam(){if(!exam||exam.scoresB.some(v=>v===null))return;const a=EXAM_A.reduce((s,q,i)=>s+(exam.A[i]===q.a?1:0),0),b=exam.scoresB.reduce((s,n)=>s+n,0),total=a+b+exam.scoreC+exam.scoreD;exam.done=true;data.history.unshift({type:'Simulasi',score:total,max:50,date:new Date().toLocaleDateString('ms-MY')});data.history=data.history.slice(0,30);stars(50);save();saveExam();clearInterval(timerInterval);render();window.scrollTo({top:0,behavior:'smooth'})}
function burst(){const x=document.createElement('span');x.className='sparkle';x.textContent='⭐';x.style.left=(30+Math.random()*45)+'%';x.style.top=(35+Math.random()*25)+'%';document.body.append(x);setTimeout(()=>x.remove(),800)}
function speak(s){if(!('speechSynthesis' in window)){toast('Fungsi suara tiada pada pelayar ini.');return}let t='';if(s==='practice'&&practice)t=practice.questions[practice.index][0]+' . '+practice.questions[practice.index][1].join('. ');if(s==='examA'&&exam)t=EXAM_A[exam.index].q;if(s==='writing')t=TASKS[writingTab].instruction;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.85;window.speechSynthesis.speak(u)}
function exportCSV(){const rows=[['Jenis','Tarikh','Markah','Markah Maksimum','Peratus'],...data.history.map(h=>[h.type,h.date,h.score,h.max,pct(h.score,h.max)])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download='Laporan_BM_Safa.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
// On shared githack hosting, answers never enter browser persistent storage.
if(!SHARED_HOST){try{const draft=JSON.parse(sessionStorage.getItem(KEY+'-exam')||'null');if(draft&&!draft.done){exam=draft}}catch(e){}}
document.addEventListener('input',e=>{if(e.target.id==='draft'){data.drafts[writingTab]=e.target.value;save();updateCounts()}if(e.target.hasAttribute('data-binput')&&exam){exam.B[Number(e.target.dataset.binput)]=e.target.value;saveExam()}if(e.target.hasAttribute('data-examessay')&&exam){exam[e.target.dataset.examessay]=e.target.value;saveExam();updateCounts()}if(e.target.hasAttribute('data-scorerange')&&exam){let s=e.target.dataset.scorerange;exam['score'+s]=Number(e.target.value);$('#score'+s).textContent=exam['score'+s]+' / '+(s==='C'?10:20);saveExam()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let d=b.dataset;
 if(d.nav){go(d.nav);return}
 if(d.note){noteTopic=d.note;go('notes');return}
 if(d.practice){startPractice(d.practice);return}
 if(d.answer!==undefined){answerPractice(Number(d.answer));return}
 if(d.next){nextPractice();return}
 if(d.wtab){writingTab=d.wtab;render();return}
 if(d.sample){showWritingSample[d.sample]=!showWritingSample[d.sample];render();return}
 if(d.speak){speak(d.speak);return}
 if(d.examstart){resumeExam();return}
 if(d.examanswer!==undefined&&exam){exam.A[exam.index]=Number(d.examanswer);saveExam();render();return}
 if(d.examprev&&exam){exam.index=Math.max(0,exam.index-1);saveExam();render();return}
 if(d.examnext&&exam){if(exam.index<9)exam.index++;else exam.stage='B';saveExam();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(d.stage&&exam){exam.stage=d.stage;saveExam();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(d.submit&&exam){if(!exam.A.some(x=>x!==undefined)&&exam.B.every(x=>!x.trim())&&!exam.C.trim()&&!exam.D.trim()){toast('Safa belum mengisi jawapan. Cuba dahulu ya!');return}if(!confirm('Safa sudah bersedia untuk menyemak jawapan? Bahagian B, C dan D akan disemak bersama Ummi.'))return;exam.submitted=true;exam.stage='review';saveExam();clearInterval(timerInterval);render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(d.scoreb&&exam){let [i,n]=d.scoreb.split(':').map(Number);exam.scoresB[i]=n;saveExam();render();return}
 if(d.finish){finishExam();return}
 if(d.restart){if(!confirm('Mulakan simulasi baharu? Jawapan simulasi sekarang akan digantikan.'))return;createExam();go('examrun');startTimer();return}
 if(d.export){exportCSV();return}
 if(d.print){window.print();return}
 if(d.reset){if(!confirm('Padam semua rekod latihan, markah dan draf Safa pada peranti ini? Tindakan tidak boleh dibatalkan.'))return;data=blank();practice=null;exam=null;if(!SHARED_HOST)sessionStorage.removeItem(KEY+'-exam');save();toast('Rekod telah ditetapkan semula.');render();return}
});
render();if(exam&&!exam.submitted&&!exam.done)startTimer();
</script>
