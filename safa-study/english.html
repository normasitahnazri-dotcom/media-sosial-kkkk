function mods(){shell(`<div class="section" style="margin-top:0">📚 Select a module</div><p class="hint">Tap a topic to revise the notes and answer 6 questions.</p><div class="grid">${modules.map(m=>`<button class="tile" data-mod="${m.id}"><span class="emoji">${m.emoji}</span><span><b>Module ${m.id} · ${esc(m.name)}</b><small>${esc(m.topic)} ${store.done[m.id]?' · ✅ Completed':''}</small></span></button>`).join('')}</div>`);app.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{active=+b.dataset.mod;qi=0;quizAnswers=[];checked=false;selected=null;page='notes';render()})}
function notes(){const m=modules.find(m=>m.id===active);shell(`<button class="back" id="back">← All modules</button><div class="box soft"><span class="tag">${m.emoji} Module ${m.id}</span><h2 style="margin:7px 0 4px">${esc(m.name)}</h2><p class="hint" style="margin:0">${esc(m.topic)}</p><div class="divider"></div><div class="notegrid">${m.notes.map(n=>`<div class="notebox"><b>${esc(n[0])}</b>${esc(n[1])}</div>`).join('')}</div><div class="explain" style="margin:15px 0">💡 ${esc(m.tip)}</div><button class="btn" id="quiz">Start 6-question quiz →</button></div>`);document.getElementById('back').onclick=()=>go('modules');document.getElementById('quiz').onclick=()=>{page='quiz';render()}}
function quiz(){const m=modules.find(m=>m.id===active),q=m.questions[qi];shell(`<button class="back" id="back">← Notes</button><div class="minirow" style="justify-content:space-between"><span class="label">${m.emoji} Module ${m.id} · Question ${qi+1}/6</span><span class="tag">${quizAnswers.filter((a,i)=>i<qi&&a===m.questions[i][2]).length} correct</span></div><div class="bar" style="margin:12px 0 20px"><div style="width:${qi/6*100}%"></div></div><div class="box"><div class="qtitle">${esc(q[0])}</div>${q[1].map((o,i)=>`<button class="option ${checked?(i===q[2]?'good':i===selected?'bad':''):i===selected?'on':''}" data-choice="${i}" ${checked?'disabled':''}>${'ABC'[i]}. ${esc(o)}</button>`).join('')}${checked?`<div class="explain ${selected===q[2]?'':'badtext'}">${selected===q[2]?'✅ Great job!':'🌱 Keep learning!'} ${esc(q[3])}</div>`:''}<div class="minirow" style="justify-content:space-between;margin-top:18px"><span class="hint">Choose one answer.</span>${checked?'<button class="btn" id="next">Next →</button>':`<button class="btn" id="check" ${selected===null?'disabled':''}>Check answer</button>`}</div></div>`);document.getElementById('back').onclick=()=>{page='notes';render()};app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=+b.dataset.choice;render()});if(checked){document.getElementById('next').onclick=()=>{quizAnswers[qi]=selected;qi++;selected=null;checked=false;if(qi>=6){const score=quizAnswers.filter((a,i)=>a===m.questions[i][2]).length;store.done[active]=true;store['score'+active]=Math.max(score,store['score'+active]??0);save();page='quizresult'}render()}}else{document.getElementById('check').onclick=()=>{checked=true;render()}}}
function quizResult(){const m=modules.find(m=>m.id===active);const score=quizAnswers.filter((a,i)=>a===m.questions[i][2]).length;shell(`<div class="result"><div style="font-size:55px">${score>=5?'🏆':'🌱'}</div><div class="section" style="margin:6px 0">${score>=5?'Amazing work, Safa!':'You are learning, Safa!'}</div><div class="score">${score}/6</div><p>${score>=5?'Great! Ready for another module?':'Review the notes and try again — practice makes progress.'}</p><div class="minirow" style="justify-content:center"><button class="btn" id="retry">Try again</button><button class="btn alt" id="all">All modules</button></div></div>`);document.getElementById('retry').onclick=()=>{qi=0;quizAnswers=[];selected=null;checked=false;page='notes';render()};document.getElementById('all').onclick=()=>go('modules')}
function spelling(){const [word,clue]=spells[spellI];shell(`<div class="section" style="margin-top:0">🔤 Health Spelling Challenge</div><p class="hint">Spell the word correctly. 8 important words for Module 10.</p><div class="minirow" style="justify-content:space-between"><span class="label">Word ${spellI+1} of ${spells.length}</span><span class="tag">${Object.keys(store.spell||{}).length}/8 practised</span></div><div class="bar" style="margin:12px 0"><div style="width:${(spellI+1)/spells.length*100}%"></div></div><div class="box"><p class="muted">Clue: ${esc(clue)}</p><div class="word">${word.split(' ').map(w=>w[0].toUpperCase()+' _ '.repeat(Math.max(0,w.length-1))).join(' / ')}</div><input id="spellInput" class="textInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the word here..." value="${esc(spellGuess)}" ${spellChecked?'disabled':''}><div id="spellfeedback">${spellChecked?`<div class="explain ${spellGuess.trim().toLowerCase()===word?'':'badtext'}">${spellGuess.trim().toLowerCase()===word?'✅ Correct!':'💡 Correct answer: '+esc(word)}</div>`:''}</div><div class="minirow" style="margin-top:16px;justify-content:space-between"><button class="btn alt" id="prev" ${spellI===0?'disabled':''}>← Previous</button>${spellChecked?'<button class="btn" id="next">Next word →</button>':'<button class="btn" id="check">Check spelling</button>'}</div></div>`);document.getElementById('prev').onclick=()=>{spellI--;spellGuess='';spellChecked=false;render()};if(spellChecked){document.getElementById('next').onclick=()=>{spellI=(spellI+1)%spells.length;spellChecked=false;spellGuess='';render()}}else{document.getElementById('spellInput').oninput=e=>{spellGuess=e.target.value};document.getElementById('check').onclick=()=>{spellGuess=document.getElementById('spellInput').value;spellChecked=true;store.spell[spellI]=spellGuess.trim().toLowerCase()===word;save();render()}}}
function email(){const d=emails[emailKey];shell(`<div class="section" style="margin-top:0">✉️ Email Writing Studio</div><p class="hint">Read the task, follow the hints and write your own email. Safa's draft is not graded automatically.</p><div class="tabs"><button id="ram" class="${emailKey==='ramadan'?'on':''}">🌙 Ramadan</button><button id="cln" class="${emailKey==='clean'?'on':''}">🧹 Gotong-royong</button></div><div class="box"><div class="label">Writing task</div><div class="qtitle" style="font-size:19px">${esc(d.prompt)}</div><div class="notegrid">${d.clues.map((c,i)=>`<div class="notebox"><b>Tip ${i+1}</b>${esc(c)}</div>`).join('')}</div><div class="divider"></div><label for="draft"><b>My email</b></label><textarea class="textInput" id="draft" placeholder="Dear ...&#10;How are you? ...">${esc(store.email[emailKey])}</textarea><div class="minirow" style="justify-content:space-between;margin-top:11px"><span class="hint"><span id="wc">${(store.email[emailKey].trim().match(/\S+/g)||[]).length}</span> words · Saved on this device when possible</span><button class="btn alt small" id="sample">${showSample?'Hide':'Show'} example</button></div>${showSample?`<div class="emailPreview" style="margin-top:12px">${esc(d.example)}</div>`:''}<div class="explain">💡 Checklist: greeting, topic details, correct sentences, closing, spelling & punctuation. Ask Ummi to check the email.</div></div>`);document.getElementById('ram').onclick=()=>{emailKey='ramadan';showSample=false;render()};document.getElementById('cln').onclick=()=>{emailKey='clean';showSample=false;render()};document.getElementById('sample').onclick=()=>{showSample=!showSample;render()};document.getElementById('draft').oninput=e=>{store.email[emailKey]=e.target.value;document.getElementById('wc').textContent=(e.target.value.trim().match(/\S+/g)||[]).length;save()}}
const parts=[['Short texts','5 marks'],['Lexico-grammar','4 marks'],['Reading comprehension','5 marks'],['Matching','6 marks'],['Word completion','5 marks'],['Guided writing','10 marks'],['Longer message','15 marks']];
function answered(q,i){const a=store.exam.answers[i];return q.word?String(a||'').trim().toLowerCase().replace(/\s+/g,' ')===q.word:a===q.a}
function objScore(){return examQuestions.reduce((t,q,i)=>t+(answered(q,i)?1:0),0)}
function exam(){const n=examQuestions.filter(q=>q.p===examPart),offset=examQuestions.findIndex(q=>q.p===examPart),writing=examPart>5;const instruction=examPart===6?'You received a message from your friend asking how you celebrate Ramadan. Write a short reply. Include two activities and a friendly closing.':examPart===7?'Write an email to your friend about a school gotong-royong. Expand these notes: date Saturday, time 8 a.m., school, sweep classrooms, collect rubbish, bring gloves and water, invite your friend.':'';shell(`<div class="section" style="margin-top:0">📝 Mock UASA · English Year 4</div><p class="hint">Practice paper based on KPM’s 2025 seven-part structure. Total 50 marks · Recommended time 75 minutes. Original practice questions, not an official exam paper.</p><div class="stepGrid">${parts.map((p,i)=>`<button class="step ${examPart===i+1?'on':''}" data-part="${i+1}">Part ${i+1}</button>`).join('')}</div><div class="box" style="margin-top:13px"><div class="minirow" style="justify-content:space-between"><div><span class="label">Part ${examPart} of 7</span><h2 style="font-size:18px;margin:2px 0">${parts[examPart-1][0]}</h2></div><span class="tag">${parts[examPart-1][1]}</span></div>${writing?`<div class="divider"></div><p>${esc(instruction)}</p><textarea id="examWrite" class="textInput" placeholder="Write your message here...">${esc(store.exam.writing[examPart]||'')}</textarea><p class="caption">Writing is NOT marked by the app. Ummi/Teacher should check content, organisation, grammar and spelling.</p><label class="label" for="mark">Optional: Marks awarded by Ummi/Teacher</label><select id="mark" class="textInput"><option value="">Not marked yet</option>${Array.from({length:examPart===6?11:16},(_,i)=>`<option value="${i}" ${String(store.exam.marks[examPart])===String(i)?'selected':''}>${i} / ${examPart===6?10:15}</option>`).join('')}</select>`:`<div class="divider"></div>${n.map((q,j)=>{const a=store.exam.answers[offset+j];return `<div style="margin-bottom:19px"><div style="font-size:14px;font-weight:740;margin-bottom:7px">${offset+j+1}. ${esc(q.q)}</div>${q.word?`<input class="textInput" data-input="${offset+j}" value="${esc(a||'')}" placeholder="Type the full word" spellcheck="false" autocomplete="off">`:q.o.map((o,k)=>`<button class="option ${a===k?'on':''}" style="padding:9px 12px;margin:5px 0" data-q="${offset+j}" data-a="${k}">${'ABC'[k]}. ${esc(o)}</button>`).join('')}</div>`}).join('')}`}<div class="divider"></div><div class="minirow" style="justify-content:space-between"><button class="btn alt small" id="prev" ${examPart===1?'disabled':''}>← Previous</button>${examPart===7?'<button class="btn" id="result">View results →</button>':'<button class="btn" id="next">Next part →</button>'}</div></div>`);app.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{examPart=+b.dataset.part;render()});app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{store.exam.answers[+b.dataset.q]=+b.dataset.a;save();render()});app.querySelectorAll('[data-input]').forEach(b=>b.oninput=e=>{store.exam.answers[+b.dataset.input]=e.target.value;save()});if(writing){document.getElementById('examWrite').oninput=e=>{store.exam.writing[examPart]=e.target.value;save()};document.getElementById('mark').onchange=e=>{store.exam.marks[examPart]=e.target.value;save()}}document.getElementById('prev').onclick=()=>{if(examPart>1){examPart--;render()}};const next=document.getElementById('next');if(next)next.onclick=()=>{examPart++;render()};const res=document.getElementById('result');if(res)res.onclick=()=>{showExamResult=true;page='examresult';render()}}
function examResult(){const n=objScore(),m6=store.exam.marks[6],m7=store.exam.marks[7],marked=m6!==''&&m7!=='';const total=n+(marked?Number(m6)+Number(m7):0);const missing=examQuestions.filter((q,i)=>store.exam.answers[i]===undefined||store.exam.answers[i]==='').length;shell(`<div class="result"><div style="font-size:50px">🏅</div><h2>Well done for trying, Safa!</h2><p class="hint">Objective/word completion (Parts 1–5)</p><div class="score">${n}/25</div><p>${marked?`Total assessed marks: <b>${total}/50</b> (includes Ummi/Teacher writing marks)`:'Writing Parts 6 & 7 need Ummi/Teacher marking before a total /50 can be given.'}</p><div class="minirow" style="justify-content:center"><button class="btn" id="review">Review answers</button><button class="btn alt" id="writing">Check writing</button></div></div><div class="box" style="margin-top:16px"><b>Learning summary</b><p class="hint">${missing} objective questions not answered. Keep revising the topics you missed.</p><div class="bar"><div style="width:${n/25*100}%"></div></div><p class="hint" style="margin-bottom:0">Correct answers ${n}/25. Writing: Part 6 ${m6===''?'not marked':m6+'/10'}, Part 7 ${m7===''?'not marked':m7+'/15'}.</p></div><div class="box" id="reviewArea" style="display:none"><b>Review objective answers</b>${examQuestions.map((q,i)=>`<div style="padding:11px 0;border-bottom:1px solid #e7e8f4;font-size:13px"><div><b>${i+1}.</b> ${esc(q.q)}</div><span style="color:${answered(q,i)?'#168555':'#b64b50'};font-weight:750">${answered(q,i)?'✓ Correct':'✗ Revise'}</span> · ${esc(q.e)}</div>`).join('')}</div>`);document.getElementById('review').onclick=()=>{const a=document.getElementById('reviewArea');a.style.display=a.style.display==='none'?'block':'none'};document.getElementById('writing').onclick=()=>{page='exam';examPart=6;render()}}
function report(){const completed=modules.filter(m=>store.done[m.id]).length,sp=Object.values(store.spell||{}).filter(Boolean).length;shell(`<div class="section" style="margin-top:0">📊 Safa's Progress</div><p class="hint">For Ummi · On shared web hosting, progress only lasts for this session.</p><div class="scores"><div class="stat"><b>${completed}/8</b><span>Modules done</span></div><div class="stat"><b>${sp}/8</b><span>Spellings right</span></div><div class="stat"><b>${objScore()}/25</b><span>Mock objective</span></div></div><div class="section">Topic mastery</div><div class="vstack">${modules.map(m=>`<div class="box" style="margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center"><span>${m.emoji} <b>Module ${m.id}</b> · ${esc(m.name)}</span><span class="tag">${store.done[m.id]?(store['score'+m.id]??0)+'/6 best':'Not yet'}</span></div>`).join('')}</div><div class="box" style="margin-top:15px"><b>Suggested study routine</b><p class="hint">10–15 minutes per topic, 5 minutes spelling, 10 minutes email practice. Review mistakes before the mock test.</p><button class="btn alt small" id="copy">Copy progress summary</button> <button class="btn ghost small" id="reset">Reset all results</button></div>`);document.getElementById('copy').onclick=()=>{const s='Safa Smart English Year 4\nCompleted: '+completed+'/8 modules\nSpelling correct: '+sp+'/8\nMock objective: '+objScore()+'/25\n'+modules.map(m=>'Module '+m.id+': '+(store.done[m.id]?(store['score'+m.id]??0)+'/6 best':'not yet')).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('Progress copied!')).catch(()=>alert(s));else alert(s)};document.getElementById('reset').onclick=()=>{if(confirm('Reset all Safa’s English progress, emails and mock answers on this device?')){store={done:{},spell:{},email:{ramadan:'',clean:''},exam:{answers:{},writing:{6:'',7:''},marks:{6:'',7:''}}};save();render()}}}
function render(){if(page==='home')home();else if(page==='modules')mods();else if(page==='notes')notes();else if(page==='quiz')quiz();else if(page==='quizresult')quizResult();else if(page==='spelling')spelling();else if(page==='email')email();else if(page==='exam')exam();else if(page==='examresult')examResult();else if(page==='report')report();else home()};render();
})();
</script></body></html>
